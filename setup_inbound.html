<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zbilz - Customize Stock Inbound</title>
    
    <script src="auth-guard.js"></script>

    <style>
        /* RESET & BASE STYLES */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background-image: url('https://res.cloudinary.com/ddff5thvj/image/upload/v1779987780/bbyh3a5rllxtnuhn3ljv.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            overflow-y: auto;
            padding: 20px 15px 50px 15px;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.82);
            top: 0;
            left: 0;
            z-index: 1;
        }

        h1 {
            color: white;
            font-size: 28px;
            margin-bottom: 5px;
            text-shadow: 0 0 10px #ff7200;
            position: relative;
            z-index: 2;
            margin-top: 15px;
            text-align: center;
        }

        h1 span { color: #ff7200; }

        .admin-warning-subtitle {
            color: #ff3333;
            font-size: 12px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 30px;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        /* CENTRALIZED CONTAINER MATRIX */
        .admin-workspace {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            width: 100%;
            max-width: 500px;
            z-index: 2;
            position: relative;
        }

        .control-panel, .registry-panel {
            width: 100% !important;
            max-width: 100% !important;
        }

        /* SEARCH DRAWER BOX */
        .search-box-wrapper {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            width: 100%;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
        }

        .search-row {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        /* MASTER FORM INPUT OVERRIDES */
        #editStockForm input[type="text"],
        #editStockForm input[type="number"],
        .search-row input[type="text"] {
            width: 100% !important;
            height: 48px !important;
            background: rgba(255, 255, 255, 0.06) !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            border-radius: 10px !important;
            padding: 0 15px !important;
            color: white !important;
            font-size: 15px !important;
            margin-bottom: 15px !important;
            box-sizing: border-box !important;
            outline: none;
        }

        .search-row input[type="text"] {
            margin-bottom: 0 !important;
        }

        #editStockForm label,
        .search-box-wrapper label {
            display: block;
            color: #ff7200;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
            text-align: left;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .search-row button {
            background: #ff7200;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 0 22px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
            transition: background 0.2s;
        }

        .search-row button:hover {
            background: #e06500;
        }

        /* DISABLED SECURITY MASK FOR DATA FORM */
        .disabled-form {
            opacity: 0.25;
            pointer-events: none;
            filter: grayscale(1);
        }

        #editStockForm {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 25px 20px;
            border-radius: 20px;
            width: 100%;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
            margin-top: 5px;
        }

        .read-only-input {
            background: rgba(255, 255, 255, 0.02) !important;
            border: 1px dashed rgba(255, 255, 255, 0.25) !important;
            color: #ff7200 !important;
            font-weight: bold;
        }

        /* MANAGEMENT ACTION BUTTONS */
        .admin-button-group {
            display: flex;
            gap: 15px;
            margin-top: 5px;
        }

        .btn-action {
            flex: 1;
            height: 48px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            color: white;
            transition: opacity 0.2s;
        }

        .btn-action:hover {
            opacity: 0.9;
        }

        .btn-save { background: #ff7200; }
        .btn-danger { background: #cc2424; }

        /* DATA REGISTRY BLOCK MONITOR */
        .registry-panel {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px 15px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            color: white;
            overflow: hidden;
        }

        .registry-panel h3 {
            color: #ff7200;
            margin-bottom: 15px;
            font-size: 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 8px;
            text-align: left;
        }

        /* HORIZONTAL SCROLL CONTROLLER */
        .table-scroll-container {
            width: 100%;
            overflow-x: auto;
            max-height: 380px;
            overflow-y: auto;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 400px;
        }

        th, td {
            padding: 14px 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 13px;
            white-space: nowrap;
        }

        th {
            background: rgba(255, 114, 0, 0.18);
            color: #ff7200;
            font-weight: bold;
            position: sticky;
            top: 0;
            z-index: 5;
        }

        td { color: #e0e0e0; }
        
        tr:last-child td {
            border-bottom: none;
        }

        .abort-panel-btn {
            background: #111;
            color: white;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            padding: 13px 40px;
            font-size: 15px;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
            margin-top: 5px;
            position: relative;
            z-index: 2;
            transition: background 0.2s;
        }

        .abort-panel-btn:hover {
            background: #222;
        }

        /* DESKTOP BALANCING SCREEN RESPONSIVENESS */
        @media (min-width: 950px) {
            body { padding-top: 40px; }
            .admin-workspace {
                flex-direction: row;
                max-width: 1100px;
                align-items: flex-start;
            }
            .control-panel { flex: 1; max-width: 420px; }
            .registry-panel { flex: 1.5; }
        }
    </style>
</head>
<body>

    <h1>Customize <span>Stock Inbound</span></h1>
    <p class="admin-warning-subtitle">Authorized Admin Workspace: Modify or delete master inventory records</p>

    <div class="admin-workspace">

        <div class="control-panel">
            <div class="search-box-wrapper">
                <label for="searchSku">Search Product by SKU Code</label>
                <div class="search-row">
                    <input type="text" id="searchSku" placeholder="e.g. SKU-K8J21">
                    <button type="button" id="btnFetch">Fetch</button>
                </div>
            </div>

            <form id="editStockForm" class="disabled-form">
                <label for="displaySku">Product SKU Code</label>
                <input type="text" id="displaySku" readonly class="read-only-input">

                <label for="stockName">Product Item Name</label>
                <input type="text" id="stockName" required placeholder="Item description name">

                <label for="stockQty">Available Quantity (Current Count)</label>
                <input type="number" id="stockQty" required placeholder="Adjust balance volume" min="0">

                <label for="stockPrice">Unit Retail Price (₹)</label>
                <input type="number" id="stockPrice" required placeholder="Adjust value amount" min="0">

                <div class="admin-button-group">
                    <button type="submit" id="btnUpdate" class="btn-action btn-save">Update Record</button>
                    <button type="button" id="btnDelete" class="btn-action btn-danger">Delete Item</button>
                </div>
            </form>
        </div>

        <div class="registry-panel">
            <h3>Active Warehouse Stock Grid</h3>
            <div class="table-scroll-container">
                <div id="inventoryLiveGrid">Reading warehouse node data...</div>
            </div>
        </div>

    </div>

    <div style="text-align: center; width: 100%; margin-top: 25px;">
        <a href="setup.html" class="abort-panel-btn">Back to Setup Hub</a>
    </div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyC7bl9e1sDibEe4BP1PzWnOhwt_gpL7abo",
    authDomain: "zbillz-f4798.firebaseapp.com",
    databaseURL: "https://zbillz-f4798-default-rtdb.firebaseio.com",
    projectId: "zbillz-f4798",
    storageBucket: "zbillz-f4798.firebasestorage.app",
    messagingSenderId: "495466751324",
    appId: "1:495466751324:web:324e3440f13fad0acdcd99"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let completeInventory = {};
let targetFirebaseKey = null;

// LIVE-STREAM ALL WAREHOUSE INVENTORY NODES
onValue(ref(db, "inventory"), (snapshot) => {
    completeInventory = {};
    if (snapshot.exists()) {
        completeInventory = snapshot.val();
    }
    renderLiveInventoryGrid();
});

// BUILD AND RENDER INVENTORY TABLE WITH MAXIMUM DATA-KEY FALLBACKS
function renderLiveInventoryGrid() {
    const displayContainer = document.getElementById("inventoryLiveGrid");
    const keys = Object.keys(completeInventory);

    if (keys.length === 0) {
        displayContainer.innerHTML = "<p style='color: #aaa; text-align:center; padding: 20px;'>Warehouse inventory node is empty.</p>";
        return;
    }

    let gridHtml = `
        <table>
            <thead>
                <tr>
                    <th>SKU Code</th>
                    <th>Product Name</th>
                    <th>Quantity</th>
                    <th>Unit Price</th>
                </tr>
            </thead>
            <tbody>
    `;

    keys.forEach(keyId => {
        const item = completeInventory[keyId];
        
        // SKU VARIATION CHECK MATRIX
        const actualSku = item.sku || 
                          item.productSku || 
                          item.product_sku || 
                          item.itemSku || 
                          item.skuCode || 
                          item.id || 
                          'N/A';
        
        const actualName = item.productName || item.name || item.itemName || 'N/A';
        
        // 🔥 CRITICAL QUANTITY FALLBACK CHECKER (Checks productQuantity, pqty, stock, etc.)
        let actualQty = 0;
        if (item.quantity !== undefined) actualQty = item.quantity;
        else if (item.qty !== undefined) actualQty = item.qty;
        else if (item.productQuantity !== undefined) actualQty = item.productQuantity;
        else if (item.productqty !== undefined) actualQty = item.productqty;
        else if (item.pqty !== undefined) actualQty = item.pqty;
        else if (item.stock !== undefined) actualQty = item.stock;
        else if (item.initialQty !== undefined) actualQty = item.initialQty;

        // PRICE VARIATION CHECK MATRIX
        const actualPrice = item.retailPrice || item.price || item.unitPrice || item.productPrice || 0;

        gridHtml += `
            <tr onclick="quickSelectSku('${actualSku}')" style="cursor: pointer;" title="Click to auto-populate editor tool">
                <td style="color: #ff7200; font-weight: bold;">${actualSku}</td>
                <td>${actualName}</td>
                <td style="font-weight: bold; color: ${Number(actualQty) > 0 ? '#55ff55' : '#ff4444'}">${actualQty}</td>
                <td>₹${actualPrice}</td>
            </tr>
        `;
    });

    gridHtml += `</tbody></table>`;
    displayContainer.innerHTML = gridHtml;
}

// TAP ROW INSTANT SHORTCUT VALUE INJECTOR
window.quickSelectSku = function(skuCode) {
    document.getElementById("searchSku").value = skuCode;
    fetchProductToEditor();
};

document.getElementById("btnFetch").addEventListener("click", fetchProductToEditor);

// SEARCH & POPULATE ENGINE FOR MUTATION FIELDS
function fetchProductToEditor() {
    const searchTarget = document.getElementById("searchSku").value.trim().toUpperCase();
    if (!searchTarget) { alert("Please provide a SKU code to search."); return; }

    targetFirebaseKey = null;
    let matchingData = null;

    for (const keyId in completeInventory) {
        const item = completeInventory[keyId];
        const activeSku = (item.sku || item.productSku || item.product_sku || item.itemSku || item.skuCode || item.id || "").toUpperCase();
        
        if (activeSku && activeSku === searchTarget) {
            targetFirebaseKey = keyId;
            matchingData = item;
            break;
        }
    }

    if (targetFirebaseKey && matchingData) {
        const structuralSku = matchingData.sku || matchingData.productSku || matchingData.product_sku || matchingData.itemSku || matchingData.skuCode || matchingData.id;
        
        // Find correct quantity key structure to populate editor field
        let targetQty = 0;
        if (matchingData.quantity !== undefined) targetQty = matchingData.quantity;
        else if (matchingData.qty !== undefined) targetQty = matchingData.qty;
        else if (matchingData.productQuantity !== undefined) targetQty = matchingData.productQuantity;
        else if (matchingData.productqty !== undefined) targetQty = matchingData.productqty;
        else if (matchingData.pqty !== undefined) targetQty = matchingData.pqty;
        else if (matchingData.stock !== undefined) targetQty = matchingData.stock;
        else if (matchingData.initialQty !== undefined) targetQty = matchingData.initialQty;

        document.getElementById("displaySku").value = structuralSku;
        document.getElementById("stockName").value = matchingData.productName || matchingData.name || matchingData.itemName || "";
        document.getElementById("stockQty").value = targetQty;
        document.getElementById("stockPrice").value = matchingData.retailPrice || matchingData.price || matchingData.unitPrice || matchingData.productPrice || 0;

        document.getElementById("editStockForm").classList.remove("disabled-form");
    } else {
        alert("SKU code tracking query returned 0 results in warehouse database node.");
        clearEditorState();
    }
}

function clearEditorState() {
    targetFirebaseKey = null;
    document.getElementById("editStockForm").reset();
    document.getElementById("displaySku").value = "";
    document.getElementById("editStockForm").classList.add("disabled-form");
}

// UPDATE RECORD MUTATOR EXECUTIONS
document.getElementById("editStockForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!targetFirebaseKey) return;

    const originalItem = completeInventory[targetFirebaseKey];
    const modifiedPayload = {};

    // Match exact text properties found inside database node
    if (originalItem.productName !== undefined) modifiedPayload.productName = document.getElementById("stockName").value.trim();
    if (originalItem.name !== undefined) modifiedPayload.name = document.getElementById("stockName").value.trim();
    if (originalItem.itemName !== undefined) modifiedPayload.itemName = document.getElementById("stockName").value.trim();

    if (originalItem.quantity !== undefined) modifiedPayload.quantity = Number(document.getElementById("stockQty").value);
    if (originalItem.qty !== undefined) modifiedPayload.qty = Number(document.getElementById("stockQty").value);
    if (originalItem.productQuantity !== undefined) modifiedPayload.productQuantity = Number(document.getElementById("stockQty").value);
    if (originalItem.productqty !== undefined) modifiedPayload.productqty = Number(document.getElementById("stockQty").value);
    if (originalItem.pqty !== undefined) modifiedPayload.pqty = Number(document.getElementById("stockQty").value);
    if (originalItem.stock !== undefined) modifiedPayload.stock = Number(document.getElementById("stockQty").value);

    if (originalItem.retailPrice !== undefined) modifiedPayload.retailPrice = Number(document.getElementById("stockPrice").value);
    if (originalItem.price !== undefined) modifiedPayload.price = Number(document.getElementById("stockPrice").value);
    if (originalItem.unitPrice !== undefined) modifiedPayload.unitPrice = Number(document.getElementById("stockPrice").value);
    if (originalItem.productPrice !== undefined) modifiedPayload.productPrice = Number(document.getElementById("stockPrice").value);

    try {
        await update(ref(db, `inventory/${targetFirebaseKey}`), modifiedPayload);
        alert("Master inventory ledger record modified successfully.");
        clearEditorState();
    } catch (err) {
        alert("Write transaction rejected by database rules: " + err.message);
    }
});

// REMOVE ENTRIES COMPLETELY
document.getElementById("btnDelete").addEventListener("click", async () => {
    if (!targetFirebaseKey) return;
    
    const confirmation = confirm("CRITICAL OPERATION:\nAre you absolutely certain you want to purge this entire product data tree from the permanent ledger?");
    if (!confirmation) return;

    try {
        await remove(ref(db, `inventory/${targetFirebaseKey}`));
        alert("Stock index item completely dropped from cloud system architecture.");
        clearEditorState();
        document.getElementById("searchSku").value = "";
    } catch (err) {
        alert("Erase command failed: " + err.message);
    }
});

</script>

</body>
</html>
