<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zbilz - Secure Sign In</title>
    <link rel="stylesheet" href="stylelogin.css">
</head>
<body>

    <div class="login-container">
        <h2>Zbilz <span>Portal</span></h2>
        <p>Access your dashboard metrics securely using your company credentials.</p>

        <form id="credentialLoginForm">
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="loginUsername" placeholder="Enter username" required>
            </div>
            
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="Enter password" required>
            </div>

            <button type="submit" class="submit-btn">Login</button>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC7bl9e1sDibEe4BP1PzWnOhwt_gpL7abo",
            authDomain: "zbillz-f4798.firebaseapp.com",
            databaseURL: "https://zbillz-f4798-default-rtdb.firebaseio.com",
            projectId: "zbillz-f4798",
            storageBucket: "zbillz-f4798.firebasestorage.app",
            messagingSenderId: "495466751324",
            appId: "1:495466751324:web:324e3440f13fad0acdcd99",
            measurementId: "G-8SZG4XLT9P"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // 1. MASTER ADMIN (Built directly into the code)
        const MASTER_USER = "admin";
        const MASTER_PASS = "ZbilzPassword123"; // You can change this text password here

        const credentialForm = document.getElementById('credentialLoginForm');
        
        credentialForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            
            const typedUser = document.getElementById('loginUsername').value.trim();
            const typedPass = document.getElementById('loginPassword').value;

            // First: Check if they are logging into the hardcoded Master Admin
            if (typedUser === MASTER_USER && typedPass === MASTER_PASS) {
                localStorage.setItem("isLoggedIn", "true");
                localStorage.setItem("userRole", "admin");
                window.location.href = "index.html";
                return;
            }

            // Second: If it's not the master admin, look up registered users from the Firebase database
            const userRef = ref(db, `registered_users/${typedUser}`);
            
            try {
                const snapshot = await get(userRef);
                if (snapshot.exists()) {
                    const accountData = snapshot.val();
                    
                    // Validate if database password matches what they typed
                    if (accountData.password === typedPass) {
                        localStorage.setItem("isLoggedIn", "true");
                        localStorage.setItem("userRole", accountData.role || "user");
                        window.location.href = "index.html";
                    } else {
                        alert("Incorrect password. Please try again.");
                    }
                } else {
                    alert("Account username not registered in system.");
                }
            } catch (error) {
                console.error("Database connection failure: ", error);
                alert("Error connecting to login system.");
            }
        });
    </script>
</body>
</html>
