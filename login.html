<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zbilz - Secure Sign In</title>
    <link rel="stylesheet" href="stylelogin.css">
</head>
<body>

    <div class="login-container">
        <h2>Zbilz <span>Portal</span></h2>
        <p>Access your dashboard metrics securely using your authorized company Google account.</p>

        <button id="googleLoginBtn" class="login-btn">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
            </svg>
            Sign in with Google
        </button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC7bl9e1sDibEe4BP1PzWnOhwt_gpL7abo",
            authDomain: "zbillz-f4798.firebaseapp.com",
            databaseURL: "https://zbillz-f4798-default-rtdb.firebaseio.com",
            projectId: "zbillz-f4798",
            storageBucket: "zbillz-f4798.firebasestorage.app",
            messagingSenderId: "495466751324",
            appId: "1:495466751324:web:324e3440f13fad0acdcd99",
            measurementId: "G-8SZG4XLT9P"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // ⚠️ TYPE YOUR CHOSEN ADMIN GOOGLE EMAIL LOWERCASE HERE
        const ADMIN_ACCOUNTS = ["yourusername@gmail.com"]; 

        const loginBtn = document.getElementById('googleLoginBtn');

        if(loginBtn) {
            loginBtn.addEventListener('click', () => {
                // Let us know the button click registered physically
                console.log("Button tapped. Contacting Firebase Auth standard gateway...");

                signInWithPopup(auth, provider)
                    .then((result) => {
                        const user = result.user;
                        
                        localStorage.setItem("isLoggedIn", "true");
                        
                        if (user.email && ADMIN_ACCOUNTS.includes(user.email.toLowerCase())) {
                            localStorage.setItem("userRole", "admin");
                        } else {
                            localStorage.setItem("userRole", "user");
                        }

                        window.location.href = "index.html";
                    })
                    .catch((error) => {
                        console.error("Firebase Auth Error Details: ", error);
                        // This alert box will intercept the exact blocking issue if it fails!
                        alert("Firebase Login Error: " + error.message);
                    });
            });
        } else {
            console.error("Critical Error: HTML button element with ID 'googleLoginBtn' missing.");
        }
    </script>
</body>
</html>
