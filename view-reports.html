<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Warehouse Reports</title>
<link rel="stylesheet" href="view-reports.css">
    <style>
        /* BASE STYLING & BACKGROUND */
        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            background-image: url('https://res.cloudinary.com/ddff5thvj/image/upload/v1779987780/bbyh3a5rllxtnuhn3ljv.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            color: white;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: -1; 
        }

        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            font-size: 38px;
            margin-bottom: 40px;
        }

        h1 span {
            color: #ff7200;
            text-shadow: 0 0 15px rgba(255, 114, 0, 0.8);
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            overflow-x: auto;
        }

        /* TABLE STYLING */
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th {
            background: rgba(0, 0, 0, 0.6);
            color: #ff7200;
            padding: 18px;
            text-align: left;
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 1px;
            border-bottom: 2px solid #ff7200;
        }

        td {
            padding: 16px 18px;
            color: #ddd;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        /* STATUS & BUTTONS */
        .status {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
        }
        .status.inbound { background: rgba(46, 204, 113, 0.2); color: #2ecc71; }
        .status.outbound { background: rgba(231, 76, 60, 0.2); color: #e74c3c; }

        .view-file-btn {
            background: #ff7200;
            color: white;
            padding: 8px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
            transition: 0.3s;
        }

        .view-file-btn:hover {
            background: #e66600;
            box-shadow: 0 0 10px rgba(255, 114, 0, 0.4);
        }

        .no-file { color: #666; font-style: italic; }

        /* BUTTONS */
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .btn {
            background: #1a1a1a;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 14px 35px;
            font-weight: bold;
            text-decoration: none;
            transition: 0.4s;
        }

        .btn:hover {
            background: #252525;
            border-color: #ff7200;
            transform: translateY(-3px);
            box-shadow: 0 0 15px rgba(255, 114, 0, 0.5);
        }

        .btn-clear {
            border-color: #e74c3c;
        }
        .btn-clear:hover {
            border-color: #e74c3c;
            box-shadow: 0 0 15px rgba(231, 76, 60, 0.5);
        }
    </style>
</head>
<body>

    <main class="dashboard-container">
        <h1>Master <span>Reports Database</span></h1>

        <div class="glass-panel">
            <table>
                <thead>
                    <tr>
                        <th>Report ID</th>
                        <th>Date Logged</th>
                        <th>Vendor Name</th>
                        <th>Product Details</th>
                        <th>Type</th>
                        <th>Attachment</th>
                    </tr>
                </thead>
                <tbody id="master-table-body">
                    </tbody>
            </table>
        </div>

        <div class="btn-group">
            <a href="reports.html" class="btn">Back to Log Reports</a>
            <button id="clear-data-btn" class="btn btn-clear">Clear Database</button>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tableBody = document.getElementById('master-table-body');
            const clearBtn = document.getElementById('clear-data-btn');

            // 1. Pull data from the browser memory
            let savedReports = JSON.parse(localStorage.getItem('warehouseReports')) || [];

            function renderMasterTable() {
                tableBody.innerHTML = '';

                if (savedReports.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #888;">No reports found in the system.</td></tr>`;
                    return;
                }

                // Reverse the array so the newest reports show up at the top
                const reversedReports = [...savedReports].reverse();

                reversedReports.forEach(report => {
                    const fileHTML = report.fileData 
                        ? `<a href="${report.fileData}" target="_blank" class="view-file-btn" download="${report.fileName}">📁 View File</a>` 
                        : `<span class="no-file">No File</span>`;
                    
                    const statusClass = report.transType === 'Inbound' ? 'inbound' : 'outbound';

                    const newRow = document.createElement('tr');
                    newRow.innerHTML = `
                        <td style="color: #ff7200; font-weight: bold;">${report.id}</td>
                        <td>${report.date}</td>
                        <td style="color: #fff;">${report.vendor}</td>
                        <td>${report.product}</td>
                        <td><span class="status ${statusClass}">${report.transType}</span></td>
                        <td>${fileHTML}</td>
                    `;
                    tableBody.appendChild(newRow);
                });
            }

            renderMasterTable();

            // 2. Clear Database Logic (For testing purposes)
            clearBtn.addEventListener('click', () => {
                if (confirm("Are you sure you want to delete all reports? This cannot be undone.")) {
                    localStorage.removeItem('warehouseReports');
                    savedReports = [];
                    renderMasterTable();
                }
            });
        });
    </script>
</body>
</html>
