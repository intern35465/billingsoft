<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Stock Inbound</title>

    <!-- CONNECT CSS FILE -->

    <link rel="stylesheet" href="stockinbound.css">

</head>

<body>

    <div class="form-container">

        <h1>Stock Inbound</h1>

        <form onsubmit="handleSubmit(event)">

            <label>Product Name:</label><br>

            <input type="text" placeholder="Enter product name"><br>

            <label>Description:</label><br>

            <input type="text" placeholder="Enter product description"><br>

            <label>Product Quantity (grams):</label><br>

            <input type="number" placeholder="Enter quantity"><br>

            <label>No. of Products:</label><br>

            <input type="number" placeholder="Enter number of products"><br>

            <label>Price per piece:</label><br>

            <input type="number" placeholder="Enter price"><br>

            <label>SKU:</label><br>

            <input type="text" id="skuBox" readonly placeholder="Auto generated SKU"><br>

            <!-- BUTTON GROUP -->

            <div class="button-group">

                <input type="submit" value="Submit">

                <input type="reset" value="Clear">

            </div>

        </form>

    </div>

<script>

let letter = "A";
let number = 111;

function generateSKU() {
    document.getElementById("skuBox").value = letter + number;
}

window.onload = function() {
    generateSKU();
}

function handleSubmit(event) {

    event.preventDefault();

    alert("SKU: " + letter + number);

    number++;

    if(number > 999){

        number = 111;

        if(letter == "A"){
            letter = "B";
        }

        else if(letter == "B"){
            letter = "C";
        }
    }

    event.target.reset();

    generateSKU();
}

</script>

</body>

</html>
