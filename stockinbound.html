<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Inbound</title>
    
    <script src="auth-guard.js"></script>
    
    <link rel="stylesheet" href="stockinbound.css">
</head>
<body>

    <div class="form-container">
        
        <h1>Stock Inbound</h1>

        <form id="stockForm">

            <label for="productName">Product Name</label>
            <input type="text" id="productName" placeholder="Enter product name" required>

            <label for="description">Description</label>
            <input type="text" id="description" placeholder="Enter details (Optional)">

            <label for="quantityGrams">Quantity (Grams / Boxes)</label>
            <input type="number" id="quantityGrams" placeholder="Enter measurement quantity" required>

            <label for="productCount">No. of Products</label>
            <input type="number" id="productCount" placeholder="Enter stock count value" required>

            <label for="price">Price</label>
            <input type="number" id="price" placeholder="Enter individual item price" required>

            <label for="skuBox">Generated Item SKU (Unique)</label>
            <input type="text" id="skuBox" readonly>

            <div class="button-group">
                <input type="submit" value="Submit">
                <input type="reset" value="Clear">
            </div>
            
            <input type="button" value="Back to Home" onclick="window.location.href='warehouse.html'" style="background: #222; margin-top: 15px; width: 100%; border: none; border-radius: 10px; padding: 13px; color: white; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.4s;">
        </form>
        
    </div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyC7bl9e1sDibEe4BP1PzWnOhwt_gpL7abo",
    authDomain: "zbillz-f4798.firebaseapp.com",
    databaseURL: "https://zbillz-f4798-default-rtdb.firebaseio.com",
    projectId: "zbillz-f4798",
    storageBucket: "zbillz-f4798.firebasestorage.app",
    messagingSenderId: "495466751324",
    appId: "1:495466751324:web:324e3440f13fad0acdcd99"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// NON-REPEATING SKU GENERATION LOGIC
function generateUniqueSKU() {
    const chars = "ABCDEFGHIJKLMNPQRSTUVWXYZ123456789"; // Removed O and 0 to avoid visual confusion
    let result = "SKU-";
    for (let i = 0; i < 5; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    document.getElementById("skuBox").value = result;
}

// Generate the initial SKU immediately when loading the dashboard interface
generateUniqueSKU();

// Handle Form Submissions to Firebase Realtime Database
document.getElementById("stockForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const currentGeneratedSku = document.getElementById("skuBox").value;

    const data = {
        productName: document.getElementById("productName").value,
        description: document.getElementById("description").value,
        quantityGrams: Number(document.getElementById("quantityGrams").value),
        productCount: Number(document.getElementById("productCount").value),
        price: Number(document.getElementById("price").value),
        sku: currentGeneratedSku
    };

    try {
        await push(ref(db, "inventory"), data);

        // Reset all editable fields in the form element cleanly
        e.target.reset();
        
        // Instantly generate a completely new, unique random SKU for the next execution cycle
        generateUniqueSKU();

        alert("Product Saved Successfully!");
    } catch (error) {
        alert("Submission Failed: Make sure your account has admin write privileges configured.");
    }
});

// Re-generate SKU if user resets form manually to prevent stale state values
document.getElementById("stockForm").addEventListener("reset", () => {
    setTimeout(generateUniqueSKU, 10);
});

</script>

</body>
</html>
