<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stock Inbound</title>
    <link rel="stylesheet" href="stockinbound.css">

<script src="auth-guard.js"></script>
</head>

<body>

    <div class="form-container">
        <h1>Stock Inbound</h1>

        <form id="stockForm">

            <label>Product Name:</label><br>
            <input type="text" id="productName" placeholder="Enter product name" required>

            <label>Description:</label><br>
            <input type="text" id="description" placeholder="Enter product description">

            <label>Product Quantity:</label><br>
            <input type="number" id="quantityGrams" placeholder="Enter quantity" required>

            <label>No. of Products:</label><br>
            <input type="number" id="productCount" placeholder="Enter number of products" required>

            <label>Price per piece:</label><br>
            <input type="number" id="price" placeholder="Enter price" required>

            <label>SKU:</label><br>
            <input type="text" id="skuBox" readonly placeholder="Auto generated SKU">

            <div class="button-group">
                <input type="submit" value="Submit">
                <input type="reset" value="Clear">
            </div>

        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC7bl9e1sDibEe4BP1PzWnOhwt_gpL7abo",
            authDomain: "zbillz-f4798.firebaseapp.com",
            databaseURL: "https://zbillz-f4798-default-rtdb.firebaseio.com",
            projectId: "zbillz-f4798",
            storageBucket: "zbillz-f4798.firebasestorage.app",
            messagingSenderId: "495466751324",
            appId: "1:495466751324:web:324e3440f13fad0acdcd99",
            measurementId: "G-8SZG4XLT9P"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let letter = "A";
        let number = 111;

        function generateSKU() {
            const skuBox = document.getElementById("skuBox");
            if (skuBox) skuBox.value = letter + number;
        }

        generateSKU();

        const form = document.getElementById('stockForm');
        form.addEventListener('submit', async (event) => {
            event.preventDefault();

            const currentSku = letter + number;

            const stockData = {
                productName: document.getElementById("productName").value,
                description: document.getElementById("description").value,
                quantityGrams: Number(document.getElementById("quantityGrams").value),
                productCount: Number(document.getElementById("productCount").value),
                price: Number(document.getElementById("price").value),
                sku: currentSku
            };

            try {
                await push(ref(db, 'inventory'), stockData);
                alert(`Successfully saved stock for SKU: ${currentSku}`);

                number++;
                if (number > 999) {
                    number = 111;
                    if (letter == "A") letter = "B";
                    else if (letter == "B") letter = "C";
                }

                form.reset();
                generateSKU();

            } catch (error) {
                console.error("Error pushing to Firebase Realtime Database: ", error);
                alert("Failed to save data. Make sure database rules are published.");
            }
        });
    </script>

</body>

</html>
