<!DOCTYPE html>
<html>

<head>
    <title>Stock Inbound</title>

    <style>
        body {
            font-family: Arial;
            padding: 20px;
        }

        form {
            background: #f5f5f5;
            padding: 20px;
            width: 300px;
            border-radius: 10px;
            box-sizing: border-box;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        input[type="submit"],
        input[type="reset"] {
            cursor: pointer;
        }
    </style>
</head>

<body>

<h1>Stock Inbound</h1>

<form id="stockForm">

    <input type="text" id="productName" placeholder="Product Name" required>
    <input type="text" id="description" placeholder="Description">
    <input type="number" id="quantityGrams" placeholder="Quantity (grams or boxes)" required>
    <input type="number" id="productCount" placeholder="No. of Products" required>
    <input type="number" id="price" placeholder="Price" required>

    <input type="text" id="skuBox" readonly>

    <input type="submit" value="Submit">
    <input type="reset" value="Clear">

</form>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyC7bl9e1sDibEe4BP1PzWnOhwt_gpL7abo",
    authDomain: "zbillz-f4798.firebaseapp.com",
    databaseURL: "https://zbillz-f4798-default-rtdb.firebaseio.com",
    projectId: "zbillz-f4798",
    storageBucket: "zbillz-f4798.firebasestorage.app",
    messagingSenderId: "495466751324",
    appId: "1:495466751324:web:324e3440f13fad0acdcd99"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// SKU system (SAFE - NO RESET BUTTON)
let letter = localStorage.getItem("skuLetter") || "A";
let number = Number(localStorage.getItem("skuNumber")) || 111;

function generateSKU() {
    document.getElementById("skuBox").value = letter + number;
}
generateSKU();

document.getElementById("stockForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const sku = letter + number;

    const data = {
        productName: document.getElementById("productName").value,
        description: document.getElementById("description").value,
        quantityGrams: Number(document.getElementById("quantityGrams").value),
        productCount: Number(document.getElementById("productCount").value),
        price: Number(document.getElementById("price").value),
        sku: sku
    };

    await push(ref(db, "inventory"), data);

    number++;

    if (number > 999) {
        number = 111;
        if (letter === "A") letter = "B";
        else if (letter === "B") letter = "C";
    }

    localStorage.setItem("skuLetter", letter);
    localStorage.setItem("skuNumber", number);

    e.target.reset();
    generateSKU();

    alert("Product Saved Successfully!");
});

</script>

</body>
</html>
