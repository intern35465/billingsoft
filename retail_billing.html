<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retail Billing Invoice Engine</title>
    <style>
        /* Modern Premium Glassmorphic Dark Theme Configuration */
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at top left, #2c3e50, #1a252f);
            color: #f8f9fa;
            margin: 0;
            padding: 30px 15px;
            min-height: 100vh;
        }

        .billing-container {
            max-width: 950px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 35px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        }

        .store-header-box {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 15px;
        }

        .store-header-box h1 {
            margin: 0 0 5px 0;
            font-size: 28px;
            letter-spacing: 1px;
        }

        .store-header-box p {
            margin: 3px 0;
            font-size: 13px;
            color: #cbd5e1;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 20px;
            font-weight: 700;
            color: #38bdf8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .invoice-header-fields {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .vendor-profile-panel {
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 25px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #cbd5e1;
        }

        /* General Input Styling */
        input[type="text"], 
        input[type="number"], 
        select {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff !important;
            padding: 12px 14px;
            font-size: 15px;
            font-weight: 500;
            border-radius: 8px;
            outline: none;
            transition: all 0.25s ease;
            width: 100%;
            box-sizing: border-box;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        input:focus, select:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
            background: #0f172a;
        }

        input[readonly] {
            background: rgba(255, 255, 255, 0.03) !important;
            color: #94a3b8 !important;
            border-color: rgba(255, 255, 255, 0.05) !important;
            cursor: not-allowed;
        }

        /* Table Specific Fixes for Visibility */
        .items-table-wrapper {
            width: 100%;
            overflow-x: auto;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .items-table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(15, 23, 42, 0.3);
            min-width: 750px;
        }

        .items-table th {
            background: rgba(15, 23, 42, 0.9);
            color: #38bdf8;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .items-table td {
            padding: 8px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            vertical-align: middle;
        }

        /* Force high contrast in table inputs */
        .items-table input {
            background: #1e293b !important;
            color: #ffffff !important;
            border: 1px solid #475569 !important;
            font-weight: 600;
        }
        
        .items-table input:focus {
            background: #0f172a !important;
            border: 1px solid #38bdf8 !important;
        }

        /* Action Buttons */
        .btn-delete-row {
            background: #ef4444;
            color: white;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-add-row {
            background: #22c55e;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 25px;
        }

        .summary-calculation-block {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 15px;
            margin-top: 20px;
            padding-right: 10px;
        }

        .summary-row {
            display: flex;
            align-items: center;
            gap: 15px;
            width: 100%;
            max-width: 380px;
            justify-content: space-between;
        }

        .summary-row label {
            font-size: 13px;
            font-weight: 600;
            color: #cbd5e1;
        }

        .summary-row input, .summary-row select {
            max-width: 180px;
            text-align: right;
        }

        .grand-total-label { font-size: 16px !important; font-weight: 700 !important; color: #38bdf8 !important; }
        .grand-total-input { font-size: 18px !important; font-weight: 700 !important; color: #22c55e !important; }

        #dbStatusMessage {
            display: none; text-align: center; font-size: 14px; font-weight: 600;
            margin: 25px auto 5px auto; max-width: 550px; padding: 12px; border-radius: 8px;
        }

        .action-buttons-container {
            display: flex; gap: 15px; justify-content: center; align-items: center;
            margin: 20px auto 10px auto; max-width: 550px;
        }

        .btn-action {
            flex: 1; padding: 14px 24px; font-size: 15px; font-weight: 700;
            border-radius: 8px; border: none; cursor: pointer; transition: all 0.25s ease;
        }

        #submitBillBtn { background: linear-gradient(135deg, #0ea5e9, #0284c7); color: white; }
        #printBillBtn { background: linear-gradient(135deg, #22c55e, #16a34a); color: white; }

        button:disabled { background: #475569 !important; color: #94a3b8 !important; cursor: not-allowed; opacity: 0.4; }

        /* =========================================================
           PROFESSIONAL PRINT ENGINE - FIXES LAYOUT & INPUT BOXES
           ========================================================= */
        @media print {
            @page { margin: 10mm; size: A4 portrait; }
            
            body { 
                background: white !important; 
                color: black !important; 
                padding: 0 !important; 
            }
            
            .billing-container { 
                background: transparent !important; 
                border: none !important; 
                box-shadow: none !important; 
                padding: 0 !important; 
                max-width: 100% !important;
            }

            /* Hide all interactive UI elements */
            .btn-add-row, .btn-delete-row, .action-buttons-container, #dbStatusMessage, th:last-child, td:last-child { 
                display: none !important; 
            }

            /* Strip input boxes and make them look like standard typed text */
            input, select { 
                border: none !important; 
                background: transparent !important; 
                color: black !important; 
                font-size: 14px !important;
                padding: 0 !important;
                margin: 0 !important;
                box-shadow: none !important;
                -webkit-appearance: none;
                font-weight: normal !important;
            }
            
            /* Align summary inputs specifically for print */
            .summary-row input, .summary-row select { text-align: right !important; }

            /* Format Headers for Print */
            h2 { color: black !important; border-bottom: 2px solid black !important; font-size: 16px !important; margin: 15px 0 10px 0 !important; padding-bottom: 5px !important;}
            .store-header-box h1 { color: black !important; }
            .store-header-box p { color: #333 !important; }
            .form-group label { color: #555 !important; font-size: 10px !important; }

            /* Organize the grid to flow cleanly on A4 paper */
            .invoice-header-fields, .vendor-profile-panel {
                display: flex !important;
                flex-wrap: wrap !important;
                gap: 15px !important;
                margin-bottom: 15px !important;
                padding: 0 !important;
                border: none !important;
            }

            .form-group { width: 30% !important; flex-grow: 1; }

            /* Create a highly professional Ledger Table */
            .items-table-wrapper { border: none !important; overflow: visible !important; margin-bottom: 20px !important;}
            .items-table { border-collapse: collapse !important; border: 1px solid black !important; width: 100% !important; }
            .items-table th { 
                background: #f0f0f0 !important; 
                color: black !important; 
                border: 1px solid black !important; 
                padding: 8px !important;
                font-size: 12px !important;
            }
            .items-table td { 
                border: 1px solid black !important; 
                padding: 6px 8px !important; 
            }

            /* Summary Block Clean up */
            .summary-calculation-block { margin-top: 15px !important; }
            .summary-row label { color: black !important; font-weight: bold !important; }
            .grand-total-label, .grand-total-input { color: black !important; font-size: 18px !important; font-weight: bold !important; }
        }
    </style>
</head>
<body>

    <div class="billing-container">
        <div class="store-header-box">
            <h1>STORE NAME</h1>
            <p>Location: PALAKKAD | Ph No: 9876543210</p>
            <p>GSTIN: 27ABCDE1234F1Z5</p>
        </div>

        <h2>Invoice System Profile</h2>
        <div class="invoice-header-fields">
            <div class="form-group">
                <label>Bill No:</label>
                <input type="text" id="billNoInput" readonly>
            </div>
            <div class="form-group">
                <label>Invoice ID (Ref):</label>
                <input type="text" id="invoiceIdInput" readonly style="color: #38bdf8 !important; font-weight: bold;">
            </div>
            <div class="form-group">
                <label>Date:</label>
                <input type="text" id="dateInput">
            </div>
            <div class="form-group">
                <label>Time:</label>
                <input type="text" id="timeInput">
            </div>
        </div>

        <h2>Customer Profile</h2>
        <div class="vendor-profile-panel">
            <div class="form-group">
                <label>Customer Classification</label>
                <select id="customerClassificationSelect">
                    <option value="Wholesale Vendor">Wholesale Vendor</option>
                    <option value="Retail Consumer">Retail Consumer</option>
                </select>
            </div>
            <div class="form-group">
                <label>Saved Profile</label>
                <select id="vendorProfileSelect">
                    <option value="">-- Select Vendor --</option>
                    <option value="Sye" data-phone="3464655633" data-discount="5">Sye Trading Co.</option>
                    <option value="Albin" data-phone="9446123456" data-discount="10">Albin Distributors</option>
                    <option value="WalkIn" data-phone="N/A" data-discount="0">Walk-In General</option>
                </select>
            </div>
            <div class="form-group">
                <label>Discount (%)</label>
                <input type="text" id="contractDiscountInput" value="0%" readonly>
            </div>
            <div class="form-group">
                <label>Customer Name:</label>
                <input type="text" id="customerNameInput" placeholder="Name">
            </div>
            <div class="form-group">
                <label>Customer Phone:</label>
                <input type="text" id="customerPhoneInput" placeholder="Phone">
            </div>
        </div>

        <h2>Order Ledger</h2>
        <div class="items-table-wrapper">
            <table class="items-table">
                <thead>
                    <tr>
                        <th style="width: 15%;">SKU</th>
                        <th style="width: 40%;">Product Name</th>
                        <th style="width: 12%;">Quantity</th>
                        <th style="width: 15%;">Rate</th>
                        <th style="width: 13%;">Amount</th>
                        <th style="width: 5%;">Action</th>
                    </tr>
                </thead>
                <tbody id="itemsTableBody">
                    <tr>
                        <td><input type="text" class="sku-field" placeholder="A111"></td>
                        <td><input type="text" class="name-field" placeholder="Description"></td>
                        <td><input type="number" class="qty-field" value="1" min="1"></td>
                        <td><input type="number" class="rate-field" value="0.00" step="0.01"></td>
                        <td><input type="number" class="amount-field" value="0.00" readonly></td>
                        <td><button type="button" class="btn-delete-row">X</button></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <button type="button" class="btn-add-row" id="addItemLineBtn">+ Add Item Line</button>

        <div class="summary-calculation-block">
            <div class="summary-row">
                <label>Gross Price (Subtotal):</label>
                <input type="number" id="subtotalAmountInput" value="0.00" readonly>
            </div>
            <div class="summary-row">
                <label>Tax Structure:</label>
                <select id="taxBracketSelect">
                    <option value="0">GST 0%</option>
                    <option value="5">GST 5%</option>
                    <option value="12">GST 12%</option>
                    <option value="18" selected>GST 18%</option>
                    <option value="28">GST 28%</option>
                </select>
            </div>
            <div class="summary-row">
                <label class="grand-total-label">Total Amount:</label>
                <input type="number" id="totalAmountInput" class="grand-total-input" value="0.00" readonly>
            </div>
            <div class="summary-row">
                <label>Payment Method:</label>
                <select id="paymentMethodSelect">
                    <option value="Cash">Cash</option>
                    <option value="UPI">UPI</option>
                    <option value="Card">Card</option>
                </select>
            </div>
        </div>

        <div id="dbStatusMessage"></div>

        <div class="action-buttons-container">
            <button type="button" id="submitBillBtn" class="btn-action">Submit Bill</button>
            <button type="button" id="printBillBtn" class="btn-action" disabled>Print Bill</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC7bl9e1sDibEe4BP1PzWnOhwt_gpL7abo",
            authDomain: "zbillz-f4798.firebaseapp.com",
            databaseURL: "https://zbillz-f4798-default-rtdb.firebaseio.com",
            projectId: "zbillz-f4798",
            storageBucket: "zbillz-f4798.firebasestorage.app",
            messagingSenderId: "495466751324",
            appId: "1:495466751324:web:324e3440f13fad0acdcd99"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        function initInvoiceMetaFields() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            
            const randomSuffix = Math.floor(1000 + Math.random() * 9000);
            document.getElementById("billNoInput").value = `BILL-${year}${month}${day}-${randomSuffix}`;
            document.getElementById("invoiceIdInput").value = `INV-${Math.floor(100000 + Math.random() * 900000)}`;
            document.getElementById("dateInput").value = `${day}/${month}/${year}`;
            document.getElementById("timeInput").value = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        }

        document.getElementById("vendorProfileSelect").addEventListener("change", function() {
            const selectedOption = this.options[this.selectedIndex];
            if (!selectedOption.value) return;

            document.getElementById("customerNameInput").value = selectedOption.text.split("...")[0].split("Co.")[0].trim();
            document.getElementById("customerPhoneInput").value = selectedOption.getAttribute("data-phone") || "";
            document.getElementById("contractDiscountInput").value = (selectedOption.getAttribute("data-discount") || "0") + "%";
            calculateTableTotals();
        });

        function calculateTableTotals() {
            let subtotal = 0;
            const rows = document.querySelectorAll("#itemsTableBody tr");

            rows.forEach(row => {
                const qty = parseFloat(row.querySelector(".qty-field").value) || 0;
                const rate = parseFloat(row.querySelector(".rate-field").value) || 0;
                const amountField = row.querySelector(".amount-field");
                
                const lineTotal = qty * rate;
                amountField.value = lineTotal.toFixed(2);
                subtotal += lineTotal;
            });

            document.getElementById("subtotalAmountInput").value = subtotal.toFixed(2);

            const discountPercentage = parseFloat(document.getElementById("contractDiscountInput").value) || 0;
            const discountedSubtotal = subtotal - (subtotal * (discountPercentage / 100));

            const gstRate = parseFloat(document.getElementById("taxBracketSelect").value) || 0;
            const grandTotal = discountedSubtotal + (discountedSubtotal * (gstRate / 100));

            document.getElementById("totalAmountInput").value = grandTotal.toFixed(2);
        }

        function createNewRowElement() {
            const tbody = document.getElementById("itemsTableBody");
            const tr = document.createElement("tr");

            tr.innerHTML = `
                <td><input type="text" class="sku-field" placeholder="SKU Code"></td>
                <td><input type="text" class="name-field" placeholder="Description"></td>
                <td><input type="number" class="qty-field" value="1" min="1"></td>
                <td><input type="number" class="rate-field" value="0.00" step="0.01"></td>
                <td><input type="number" class="amount-field" value="0.00" readonly></td>
                <td><button type="button" class="btn-delete-row">X</button></td>
            `;

            tr.querySelector(".qty-field").addEventListener("input", calculateTableTotals);
            tr.querySelector(".rate-field").addEventListener("input", calculateTableTotals);
            tr.querySelector(".btn-delete-row").addEventListener("click", function() {
                tr.remove();
                calculateTableTotals();
            });

            tbody.appendChild(tr);
        }

        function parseItemsDataToPayload() {
            const items = [];
            const rows = document.querySelectorAll("#itemsTableBody tr");
            
            rows.forEach(row => {
                const sku = row.querySelector(".sku-field").value.trim();
                const pname = row.querySelector(".name-field").value.trim();
                const qty = parseFloat(row.querySelector(".qty-field").value) || 0;
                const rate = parseFloat(row.querySelector(".rate-field").value) || 0;
                const amount = parseFloat(row.querySelector(".amount-field").value) || 0;

                if (sku !== "" || pname !== "") {
                    items.push({ sku: sku, productName: pname || "Item", quantity: qty, rate: rate, amount: amount });
                }
            });
            return items;
        }

        async function runCloudSubmissionPipeline() {
            const submitBtn = document.getElementById("submitBillBtn");
            const printBtn = document.getElementById("printBillBtn");
            const statusMsg = document.getElementById("dbStatusMessage");

            statusMsg.style.display = "block";
            statusMsg.style.backgroundColor = "rgba(234, 179, 8, 0.15)";
            statusMsg.style.color = "#facc15"; 
            statusMsg.style.border = "1px solid rgba(234, 179, 8, 0.3)";
            statusMsg.innerText = "⏳ Syncing transaction to database...";
            
            submitBtn.disabled = true;
            submitBtn.innerText = "Submitting...";

            const invoiceKeyId = document.getElementById("invoiceIdInput").value.trim();

            const payload = {
                invoiceId: invoiceKeyId,
                billNo: document.getElementById("billNoInput").value.trim(),
                custName: document.getElementById("customerNameInput").value.trim() || "Walk-In",
                custPhone: document.getElementById("customerPhoneInput").value.trim() || "N/A",
                paymentMethod: document.getElementById("paymentMethodSelect").value,
                date: document.getElementById("dateInput").value,
                time: document.getElementById("timeInput").value,
                totalAmount: parseFloat(document.getElementById("totalAmountInput").value || 0),
                items: parseItemsDataToPayload()
            };

            try {
                await set(ref(db, "sales/" + invoiceKeyId), payload);
                
                statusMsg.style.backgroundColor = "rgba(34, 197, 94, 0.15)";
                statusMsg.style.color = "#4ade80";
                statusMsg.style.border = "1px solid rgba(34, 197, 94, 0.3)";
                statusMsg.innerText = `🎉 Uploaded Successfully! Ref: ${invoiceKeyId}`;
                
                printBtn.disabled = false;
                submitBtn.disabled = false;
                submitBtn.innerText = "Submit Bill";

            } catch (error) {
                console.error(error);
                statusMsg.style.backgroundColor = "rgba(239, 68, 68, 0.15)";
                statusMsg.style.color = "#f87171";
                statusMsg.style.border = "1px solid rgba(239, 68, 68, 0.3)";
                statusMsg.innerText = "❌ Cloud failure. Check connection.";
                
                submitBtn.disabled = false;
                submitBtn.innerText = "Submit Bill";
                printBtn.disabled = true; 
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            initInvoiceMetaFields();

            document.querySelector(".qty-field").addEventListener("input", calculateTableTotals);
            document.querySelector(".rate-field").addEventListener("input", calculateTableTotals);
            document.getElementById("taxBracketSelect").addEventListener("change", calculateTableTotals);
            
            document.querySelector(".btn-delete-row").addEventListener("click", function() {
                this.closest("tr").remove();
                calculateTableTotals();
            });

            document.getElementById("addItemLineBtn").addEventListener("click", createNewRowElement);
            document.getElementById("submitBillBtn").addEventListener("click", runCloudSubmissionPipeline);
            document.getElementById("printBillBtn").addEventListener("click", () => { window.print(); });
        });
    </script>
</body>
</html>
