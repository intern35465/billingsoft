<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retail Billing System</title>
    <link rel="stylesheet" href="retail_billing.css">
</head>
<body>

    <div class="billing-container">
        <h2>Retail Billing Invoice</h2>

        <div class="invoice-header-fields">
            <label>Invoice ID:</label>
            <input type="text" id="invoiceIdInput" value="INV-157190">

            <label>Bill Number:</label>
            <input type="text" id="billNoInput" placeholder="Enter Bill No">

            <label>Customer Name:</label>
            <input type="text" id="customerNameInput" placeholder="Walk-In Customer">

            <label>Customer Phone:</label>
            <input type="text" id="customerPhoneInput" placeholder="N/A">

            <label>Payment Method:</label>
            <select id="paymentMethodSelect">
                <option value="Cash">Cash</option>
                <option value="UPI">UPI / Digital</option>
                <option value="Card">Card</option>
            </select>

            <label>Date:</label>
            <input type="text" id="dateInput" value="30/05/2026">

            <label>Time:</label>
            <input type="text" id="timeInput" value="14:30">
        </div>

        <table class="items-table">
            <thead>
                <tr>
                    <th>SKU/Code</th>
                    <th>Product Description</th>
                    <th>Quantity</th>
                    <th>Rate (₹)</th>
                    <th>Amount (₹)</th>
                </tr>
            </thead>
            <tbody id="itemsTableBody">
                <tr>
                    <td><input type="text" placeholder="SKU001"></td>
                    <td><input type="text" placeholder="Product Name"></td>
                    <td><input type="number" class="qty-input" value="1"></td>
                    <td><input type="number" class="rate-input" value="0.00"></td>
                    <td><input type="number" class="amount-input" value="0.00" readonly></td>
                </tr>
                <tr>
                    <td><input type="text" placeholder="SKU002"></td>
                    <td><input type="text" placeholder="Product Name"></td>
                    <td><input type="number" class="qty-input" value="1"></td>
                    <td><input type="number" class="rate-input" value="0.00"></td>
                    <td><input type="number" class="amount-input" value="0.00" readonly></td>
                </tr>
            </tbody>
        </table>

        <div class="total-summary-section" style="text-align: right; margin-top: 15px;">
            <label style="font-weight: bold; font-size: 16px;">Grand Total Amount (₹): </label>
            <input type="number" id="totalAmountInput" value="0.00" step="0.01">
        </div>

        <div id="dbStatusMessage" style="display: none; text-align: center; font-weight: bold; margin: 15px 0; padding: 10px; border-radius: 4px;"></div>

        <div class="action-buttons-container">
            <button type="button" id="submitBillBtn">Submit Bill</button>
            <button type="button" id="printBillBtn" disabled>Print Bill</button>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Main database architecture link setup
        const firebaseConfig = {
            apiKey: "AIzaSyC7bl9e1sDibEe4BP1PzWnOhwt_gpL7abo",
            authDomain: "zbillz-f4798.firebaseapp.com",
            databaseURL: "https://zbillz-f4798-default-rtdb.firebaseio.com",
            projectId: "zbillz-f4798",
            storageBucket: "zbillz-f4798.firebasestorage.app",
            messagingSenderId: "495466751324",
            appId: "1:495466751324:web:324e3440f13fad0acdcd99"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Dynamic multi-row text data object mapper parser
        function getBillingItems() {
            const items = [];
            const rows = document.querySelectorAll("#itemsTableBody tr"); 
            
            rows.forEach(row => {
                const inputs = row.querySelectorAll("input");
                if (inputs.length >= 5) {
                    const sku = inputs[0].value.trim();
                    const pname = inputs[1].value.trim();
                    const qty = parseFloat(inputs[2].value) || 0;
                    const price = parseFloat(inputs[3].value) || 0;
                    const amount = parseFloat(inputs[4].value) || (qty * price);

                    // Only push row if SKU or product name is explicitly supplied
                    if (sku !== "" || pname !== "") {
                        items.push({
                            sku: sku,
                            productName: pname || "Stock Item",
                            quantity: qty,
                            rate: price,
                            amount: amount
                        });
                    }
                }
            });
            return items;
        }

        // Live submit transaction control sequence
        async function handleBillSubmission() {
            const submitBtn = document.getElementById("submitBillBtn");
            const printBtn = document.getElementById("printBillBtn");
            const statusMsg = document.getElementById("dbStatusMessage");

            // 1. Initialize processing loader state properties
            statusMsg.style.display = "block";
            statusMsg.style.backgroundColor = "#fff3cd";
            statusMsg.style.color = "#664d03"; 
            statusMsg.style.border = "1px solid #ffe69c";
            statusMsg.innerText = "⏳ Pushing transaction statement entry records directly into Firebase database backend logs...";
            
            submitBtn.disabled = true;
            submitBtn.innerText = "Submitting...";

            // 2. Format exact object payload maps
            const targetInvoiceId = document.getElementById("invoiceIdInput").value.trim() || "INV-" + Math.floor(Math.random() * 900000 + 100000);

            const payload = {
                invoiceId: targetInvoiceId,
                billNo: document.getElementById("billNoInput").value.trim() || "",
                custName: document.getElementById("customerNameInput").value.trim() || "Walk-In Customer",
                custPhone: document.getElementById("customerPhoneInput").value.trim() || "N/A",
                paymentMethod: document.getElementById("paymentMethodSelect").value,
                date: document.getElementById("dateInput").value,
                time: document.getElementById("timeInput").value,
                totalAmount: parseFloat(document.getElementById("totalAmountInput").value || 0),
                items: getBillingItems()
            };

            try {
                // 3. Perform write execution query
                await set(ref(db, "sales/" + targetInvoiceId), payload);
                
                // 4. Success handling callback updates - Lock configuration releases safely
                statusMsg.style.backgroundColor = "#d1e7dd";
                statusMsg.style.color = "#0f5132";
                statusMsg.style.border = "1px solid #badbcc";
                statusMsg.innerText = `🎉 Uploaded to Database Successfully! Invoice Reference: ${targetInvoiceId}`;
                
                printBtn.disabled = false; // UNLOCK PRINT BUTTON ROW ENTRY RIGHT NOW 🚀
                
                submitBtn.disabled = false;
                submitBtn.innerText = "Submit Bill";

            } catch (error) {
                console.error("Firebase operational crash log channel context:", error);
                
                // 5. Connection drop error fallback loops
                statusMsg.style.backgroundColor = "#f8d7da";
                statusMsg.style.color = "#842029";
                statusMsg.style.border = "1px solid #f5c2c7";
                statusMsg.innerText = "❌ Database transmission pipeline failed! Please check cloud network rules config parameter profiles.";
                
                submitBtn.disabled = false;
                submitBtn.innerText = "Submit Bill";
                printBtn.disabled = true; 
            }
        }

        // Initialize element execution bindings 
        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("submitBillBtn").addEventListener("click", handleBillSubmission);
            
            document.getElementById("printBillBtn").addEventListener("click", () => {
                window.print();
            });
        });
    </script>
</body>
</html>
