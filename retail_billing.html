<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>BILLING SYSTEM | Store Invoice</title>
    <link rel="stylesheet" href="retail_billing.css">
    <style>
        @media print {
            button,
            #addItemRowBtn,
            #printInvoiceBtn,
            #submitInvoiceBtn,
            .no-print,
            td:last-child,
            th:last-child {
                display: none !important;
            }

            input,
            select {
                border: none !important;
                background: transparent !important;
                outline: none !important;
                box-shadow: none !important;
                appearance: none !important;
                -webkit-appearance: none !important;
                -moz-appearance: none !important;
                color: #000 !important;
                padding: 0 !important;
                margin: 0 !important;
                font-family: inherit !important;
                font-size: 14px !important;
            }

            table {
                border-collapse: collapse !important;
                width: 100% !important;
            }
            th,
            td {
                border: 1px solid #000 !important;
                padding: 6px !important;
            }

            body {
                background: #fff !important;
                color: #000 !important;
                padding: 10px !important;
                margin: 0 !important;
                font-size: 14px !important;
            }

            body::before {
                display: none !important;
            }

            #billingForm {
                background: white !important;
                backdrop-filter: none !important;
                border: none !important;
                padding: 10px !important;
            }

            #submissionMessage {
                display: none !important;
            }
        }
    </style>
</head>
<body>
    <div id="billingForm">
        <center>
            <h2>STORE NAME</h2>
            <p>📍 Location: PALAKKAD | 📞 Ph No: 9876543210</p>
            <p><strong>GSTIN: 27ABCDE1234F1Z5</strong></p>
        </center>
        <hr>

        <form id="invoiceForm">
            <table border="0" width="100%">
                <tr>
                    <td width="50%" valign="top" style="border:none;">
                        <h3>📄 INVOICE DETAILS</h3>
                        <label>Bill No:</label>
                        <input type="text" id="billNo" readonly><br>

                        <label>Invoice ID:</label>
                        <input type="text" id="invoiceId" readonly><br>

                        <label>Date:</label>
                        <input type="date" id="billDate" readonly><br>

                        <label>Time:</label>
                        <input type="time" id="billTime" readonly>
                    </td>

                    <td width="50%" valign="top" align="right" style="border:none;">
                        <h3>⚙️ OPERATIONAL DETAILS</h3>
                        <label>Billing Staff:</label>
                        <input type="text" id="billingStaff" placeholder="Operator Name"><br>

                        <label>Payment Method:</label>
                        <select id="paymentMethod">
                            <option>Cash</option>
                            <option>UPI</option>
                            <option>Card</option>
                        </select>
                    </td>
                </tr>
            </table>
            <hr>

            <div class="no-print">
                <label>Customer Type:</label>
                <select id="customerTypeSelector">
                    <option value="retail">🛍️ Regular Retail Customer</option>
                    <option value="wholesale">🏢 Wholesale Vendor</option>
                </select>
                <br><br>
            </div>

            <div id="vendorDropdownArea" style="display: none;">
                <label>Select Saved Vendor:</label>
                <select id="vendorSelector">
                    <option value="">-- Select Vendor --</option>
                </select>
                <br><br>

                <div class="no-print">
                    <label>📉 Contract Discount:</label>
                    <input type="text" id="vendorDiscountBox" readonly value="0%">
                    &nbsp;&nbsp;&nbsp;
                    <label>💰 Outstanding Balance:</label>
                    <input type="text" id="vendorBalanceBox" readonly value="Rs. 0.00">
                    <br><br>
                </div>
            </div>

            <label>👤 Customer Name:</label>
            <input type="text" id="custName" placeholder="Customer name"><br><br>

            <label>📱 Customer Ph No:</label>
            <input type="number" id="custPhone" placeholder="Phone number"><br><br>

            <table border="1" id="invoiceItemsTable" width="100%">
                <thead>
                    <tr>
                        <th>SKU</th>
                        <th>Product Name</th>
                        <th>Quantity</th>
                        <th>Rate</th>
                        <th>Amount</th>
                        <th class="no-print">Action</th>
                    </tr>
                </thead>
                <tbody id="invoiceTableBody">
                </tbody>
            </table>

            <br>
            <button type="button" id="addItemRowBtn" class="no-print">➕ Add Item Line</button>
            <br><br>

            <label>💵 Price (Subtotal):</label>
            <input type="number" id="priceBox" readonly value="0.00"><br><br>

            <label>🧾 Tax Bracket:</label>
            <select id="gst">
                <option value="0">GST 0%</option>
                <option value="5">GST 5%</option>
                <option value="12">GST 12%</option>
                <option value="18">GST 18%</option>
                <option value="28">GST 28%</option>
            </select>
            <br><br>

            <label><strong>🧮 Total Amount:</strong></label>
            <input type="number" id="totalAmount" readonly value="0.00">
            <br><br><br>

            <center>
                <b class="thankyou-text">THANK YOU</b>
                <div class="action-buttons">
                    <button type="button" id="submitInvoiceBtn" class="no-print">📤 Submit Invoice</button>
                    <button type="button" id="printInvoiceBtn" class="no-print" disabled>🖨️ Print Bill</button>
                </div>
                <div id="submissionMessage"></div>
            </center>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get, push, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC7bl9e1sDibEe4BP1PzWnOhwt_gpL7abo",
            authDomain: "zbillz-f4798.firebaseapp.com",
            databaseURL: "https://zbillz-f4798-default-rtdb.firebaseio.com",
            projectId: "zbillz-f4798",
            storageBucket: "zbillz-f4798.firebasestorage.app",
            messagingSenderId: "495466751324",
            appId: "1:495466751324:web:324e3440f13fad0acdcd99"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let globalVendorsObject = {};
        let currentVendorDiscount = 0;
        let rowCounterIndex = 0;

        const submitBtn = document.getElementById("submitInvoiceBtn");
        const printBtn = document.getElementById("printInvoiceBtn");
        const messageDiv = document.getElementById("submissionMessage");

        printBtn.disabled = true;

        function initializeInvoiceIdentifiers() {
            let today = new Date();
            let datePart = today.getFullYear() + String(today.getMonth() + 1).padStart(2, "0") + String(today.getDate()).padStart(2, "0");

            let sessionBillNo = sessionStorage.getItem("currentBillNo");
            let sessionInvId = sessionStorage.getItem("currentInvId");

            if (!sessionBillNo) {
                let persistentCount = localStorage.getItem("billNumberCounter") || 1001;
                sessionBillNo = "BILL-" + datePart + "-" + persistentCount;
                sessionInvId = "INV-" + Math.floor(100000 + Math.random() * 900000);

                localStorage.setItem("billNumberCounter", Number(persistentCount) + 1);
                sessionStorage.setItem("currentBillNo", sessionBillNo);
                sessionStorage.setItem("currentInvId", sessionInvId);
            }

            document.getElementById("billNo").value = sessionBillNo;
            document.getElementById("invoiceId").value = sessionInvId;
            document.getElementById("billDate").value = today.toISOString().split("T")[0];
            document.getElementById("billTime").value = String(today.getHours()).padStart(2, "0") + ":" + String(today.getMinutes()).padStart(2, "0");
        }

        window.addNewRowItem = function() {
            rowCounterIndex++;
            const tbody = document.getElementById("invoiceTableBody");
            const newRow = document.createElement("tr");
            newRow.id = `billRow_${rowCounterIndex}`;

            newRow.innerHTML = `
                <td><input type="text" id="pcode_${rowCounterIndex}" data-id="${rowCounterIndex}" placeholder="SKU"></td>
                <td><input type="text" id="pname_${rowCounterIndex}" readonly></td>
                <td><input type="number" id="qty_${rowCounterIndex}" data-id="${rowCounterIndex}" min="1" value="1"></td>
                <td><input type="number" id="rate_${rowCounterIndex}" readonly></td>
                <td><input type="number" id="amount_${rowCounterIndex}" readonly value="0.00"></td>
                <td class="no-print"><button type="button" onclick="removeBillRowLine('${newRow.id}')">✕</button></td>
            `;
            tbody.appendChild(newRow);

            const codeInput = document.getElementById(`pcode_${rowCounterIndex}`);
            const qtyInput = document.getElementById(`qty_${rowCounterIndex}`);

            codeInput.onkeyup = function(e) {
                fetchSkuProductRowData(e.target.dataset.id);
            };
            qtyInput.oninput = function() {
                evaluateMasterTotalsCalculations();
            };
        };

        window.removeBillRowLine = function(rowId) {
            const row = document.getElementById(rowId);
            if (row) {
                row.remove();
                evaluateMasterTotalsCalculations();
            }
        };

        async function fetchSkuProductRowData(index) {
            const sku = document.getElementById(`pcode_${index}`).value.trim();
            if (!sku) return;

            try {
                const snapshot = await get(ref(db, "inventory"));
                if (snapshot.exists()) {
                    const products = snapshot.val();
                    for (let key in products) {
                        if (String(products[key].sku) === String(sku)) {
                            document.getElementById(`pname_${index}`).value = products[key].productName || "";
                            document.getElementById(`rate_${index}`).value = products[key].price || 0;
                            evaluateMasterTotalsCalculations();
                            return;
                        }
                    }
                }
            } catch (err) {
                console.error("Database lookup error: ", err);
            }
        }

        window.evaluateMasterTotalsCalculations = function() {
            let totalGrossSubtotal = 0;
            const gstPercent = Number(document.getElementById("gst").value) || 0;

            const rows = document.querySelectorAll("#invoiceTableBody tr");
            rows.forEach(row => {
                const index = row.id.split("_")[1];
                const qtyElement = document.getElementById(`qty_${index}`);
                const rateElement = document.getElementById(`rate_${index}`);
                const amountElement = document.getElementById(`amount_${index}`);

                if (qtyElement && rateElement && amountElement) {
                    const qty = Number(qtyElement.value) || 0;
                    const rate = Number(rateElement.value) || 0;
                    let lineGross = qty * rate;
                    totalGrossSubtotal += lineGross;
                    amountElement.value = lineGross.toFixed(2);
                }
            });

            let discountDeduction = (totalGrossSubtotal * currentVendorDiscount) / 100;
            let netSubtotal = totalGrossSubtotal - discountDeduction;
            let gstAmount = (netSubtotal * gstPercent) / 100;
            let finalInvoiceTotal = netSubtotal + gstAmount;

            document.getElementById("priceBox").value = totalGrossSubtotal.toFixed(2);
            document.getElementById("totalAmount").value = finalInvoiceTotal.toFixed(2);
        };

        const customerTypeSelector = document.getElementById("customerTypeSelector");
        const vendorDropdownArea = document.getElementById("vendorDropdownArea");
        const vendorSelector = document.getElementById("vendorSelector");

        customerTypeSelector.addEventListener("change", async () => {
            if (customerTypeSelector.value === "wholesale") {
                vendorDropdownArea.style.display = "block";
                await fetchWholesaleVendors();
            } else {
                vendorDropdownArea.style.display = "none";
                currentVendorDiscount = 0;
                document.getElementById("custName").value = "";
                document.getElementById("custPhone").value = "";
                evaluateMasterTotalsCalculations();
            }
        });

        async function fetchWholesaleVendors() {
            try {
                const snapshot = await get(ref(db, "wholesale_vendors"));
                vendorSelector.innerHTML = '<option value="">-- Select Vendor Profile --</option>';

                if (snapshot.exists()) {
                    globalVendorsObject = snapshot.val();
                    for (let key in globalVendorsObject) {
                        const vendor = globalVendorsObject[key];
                        const companyName = vendor.companyName || vendor.vendorName || vendor.name || key;
                        vendorSelector.innerHTML += `<option value="${key}">${companyName}</option>`;
                    }
                }
            } catch (err) {
                console.error("Error reading vendor values: ", err);
            }
        }

        vendorSelector.addEventListener("change", () => {
            const selectedKey = vendorSelector.value;
            if (selectedKey && globalVendorsObject[selectedKey]) {
                const vendorData = globalVendorsObject[selectedKey];

                document.getElementById("custName").value = vendorData.companyName || vendorData.vendorName || vendorData.name || selectedKey;
                document.getElementById("custPhone").value = vendorData.phone || vendorData.contact || "";

                currentVendorDiscount = Number(vendorData.discount) || Number(vendorData.discountRate) || 0;
                const outstandingBalance = vendorData.balance || vendorData.outstanding || 0;

                document.getElementById("vendorDiscountBox").value = currentVendorDiscount + "%";
                document.getElementById("vendorBalanceBox").value = "Rs. " + Number(outstandingBalance).toFixed(2);
            } else {
                currentVendorDiscount = 0;
                document.getElementById("vendorDiscountBox").value = "0%";
                document.getElementById("vendorBalanceBox").value = "Rs. 0.00";
            }
            evaluateMasterTotalsCalculations();
        });

        document.getElementById("gst").addEventListener("change", evaluateMasterTotalsCalculations);
        document.getElementById("addItemRowBtn").addEventListener("click", window.addNewRowItem);

        submitBtn.addEventListener("click", async () => {
            const rows = document.querySelectorAll("#invoiceTableBody tr");
            if (rows.length === 0) {
                alert("Please add at least one item to the invoice.");
                return;
            }

            const billNo = document.getElementById("billNo").value;
            const invoiceId = document.getElementById("invoiceId").value;
            const billDate = document.getElementById("billDate").value;
            const billTime = document.getElementById("billTime").value;
            const billingStaff = document.getElementById("billingStaff").value || "Counter";
            const paymentMethod = document.getElementById("paymentMethod").value;
            const customerType = document.getElementById("customerTypeSelector").value;
            const custName = document.getElementById("custName").value || "Walk-in Customer";
            const custPhone = document.getElementById("custPhone").value || "";
            const subtotal = document.getElementById("priceBox").value;
            const gstPercent = document.getElementById("gst").value;
            const totalAmount = document.getElementById("totalAmount").value;

            const items = [];
            rows.forEach(row => {
                const index = row.id.split("_")[1];
                const sku = document.getElementById(`pcode_${index}`)?.value || "";
                const pname = document.getElementById(`pname_${index}`)?.value || "";
                const qty = document.getElementById(`qty_${index}`)?.value || 0;
                const rate = document.getElementById(`rate_${index}`)?.value || 0;
                const amount = document.getElementById(`amount_${index}`)?.value || 0;
                if (sku || pname) {
                    items.push({
                        sku: sku,
                        productName: pname,
                        quantity: Number(qty),
                        rate: Number(rate),
                        amount: Number(amount)
                    });
                }
            });

            const invoicePayload = {
                billNo,
                invoiceId,
                date: billDate,
                time: billTime,
                billingStaff,
                paymentMethod,
                customerType,
                customerName: custName,
                customerPhone: custPhone,
                subtotal: Number(subtotal),
                gstPercent: Number(gstPercent),
                totalAmount: Number(totalAmount),
                discountApplied: currentVendorDiscount,
                items: items,
                createdAt: new Date().toISOString()
            };

            submitBtn.disabled = true;
            messageDiv.textContent = "⏳ Uploading invoice to database...";

            try {
                const invoicesRef = ref(db, "invoices");
                const newInvoiceRef = push(invoicesRef);
                await set(newInvoiceRef, invoicePayload);

                messageDiv.textContent = "✅ Invoice successfully uploaded to database! You can now print.";
                printBtn.disabled = false;
            } catch (error) {
                console.error("Submission error:", error);
                messageDiv.textContent = "❌ Upload failed. Please try again.";
                submitBtn.disabled = false;
            }
        });

        printBtn.addEventListener("click", () => {
            sessionStorage.removeItem("currentBillNo");
            sessionStorage.removeItem("currentInvId");
            window.print();
        });

        initializeInvoiceIdentifiers();
        window.addNewRowItem();
    </script>
</body>
</html>
