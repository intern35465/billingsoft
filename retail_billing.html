<!DOCTYPE html>  
<html lang="en">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>BILLING SYSTEM</title>  
    <link rel="stylesheet" href="retail_billing.css">  
    <style>  
        /* --- HIGH VISIBILITY MOBILE/WEB WRITING CONTROLS --- */
        input[type="text"], 
        input[type="number"], 
        input[type="date"], 
        input[type="time"], 
        select {
            background-color: #1e293b !important;
            color: #ffffff !important;
            border: 1px solid #475569 !important;
            padding: 8px 12px !important;
            font-size: 15px !important;
            font-weight: 600 !important;
            border-radius: 6px !important;
        }

        input[readonly] {
            background-color: rgba(255, 255, 255, 0.05) !important;
            color: #94a3b8 !important;
            border-color: rgba(255, 255, 255, 0.1) !important;
        }

        /* Standard Web Button Style Overrides */
        #addItemRowBtn {
            background-color: #22c55e;
            color: white;
            border: none;
            padding: 10px 18px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-action-primary {
            background: linear-gradient(135deg, #0ea5e9, #0284c7);
            color: white;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            margin: 5px;
        }

        .btn-action-secondary {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            margin: 5px;
        }

        button:disabled {
            background: #475569 !important;
            color: #94a3b8 !important;
            opacity: 0.5;
            cursor: not-allowed;
        }

        #statusNotificationArea {
            display: none;
            max-width: 600px;
            margin: 15px auto;
            padding: 12px;
            border-radius: 6px;
            font-weight: 600;
            text-align: center;
        }

        /* =========================================================
           HIGH STANDARDS PROFESSIONAL PRINT ENGINE CONFIGURATION
           ========================================================= */
        @media print {  
            @page { margin: 12mm; size: A4 portrait; }

            /* Hide web navigation controls, row controls, and action buttons entirely */  
            button,   
            #addItemRowBtn,   
            .no-print,   
            td:last-child,   
            th:last-child {   
                display: none !important;   
            }  

            /* Strip input containers and dropdown menus of background shading and input boxes */  
            input, select {  
                border: none !important;  
                background: transparent !important;  
                outline: none !important;  
                box-shadow: none !important;  
                appearance: none !important;  
                -webkit-appearance: none !important;  
                -moz-appearance: none !important;  
                color: #000 !important;  
                padding: 0 !important;  
                margin: 0 !important;  
                font-family: inherit !important;  
                font-size: 14px !important;  
                font-weight: normal !important;
            }  

            /* Clean up table lines for physical paper rendering */  
            table {  
                border-collapse: collapse !important;  
                width: 100% !important;  
                margin-top: 10px !important;
            }  
            th {
                background: #f2f2f2 !important;
                color: #000 !important;
                font-weight: bold !important;
            }
            th, td {  
                border: 1px solid #000 !important;  
                padding: 8px !important;  
                color: #000 !important;
            }  

            /* Keep left-side and right-side structures beautifully aligned on paper */  
            body {  
                background: #fff !important;  
                color: #000 !important;  
                padding: 0 !important;  
                margin: 0 !important;  
                font-size: 14px !important;  
            }  

            h2 { font-size: 24px !important; margin-bottom: 2px !important; }
            h3 { font-size: 15px !important; margin-top: 5px !important; border-bottom: 1px solid #000 !important; padding-bottom: 3px !important; }
            hr { border-top: 1px solid #000 !important; }
        }  
    </style>
</head>  
<body>  

<center>  
    <h2>STORE NAME</h2>  
    <p>Location: PALAKKAD | Ph No: 9876543210</p>  
    <p><strong>GSTIN: 27ABCDE1234F1Z5</strong></p>  
</center>  
<hr>  

<form id="billingForm">  

    <table border="0" width="100%" style="border:none;">  
        <tr>  
            <td width="50%" valign="top" style="border:none; padding:0;">  
                <h3>INVOICE DETAILS</h3>  
                <label>Bill No:</label>  
                <input type="text" id="billNo" readonly><br><br>  

                <label>Invoice ID:</label>  
                <input type="text" id="invoiceId" readonly><br><br>  

                <label>Date:</label>  
                <input type="date" id="billDate" readonly><br><br>  

                <label>Time:</label>  
                <input type="time" id="billTime" readonly>  
            </td>  

            <td width="50%" valign="top" align="right" style="border:none; padding:0;">  
                <h3>OPERATIONAL DETAILS</h3>  
                <label>Billing Staff:</label>  
                <input type="text" id="billingStaff" placeholder="Operator Name"><br><br>  

                <label>Payment Method:</label>  
                <select id="paymentMethod">  
                    <option>Cash</option>  
                    <option>UPI</option>  
                    <option>Card</option>  
                </select>  
            </td>  
        </tr>  
    </table>  
    <hr>  

    <div class="no-print">  
        <label>Customer Type:</label>  
        <select id="customerTypeSelector">  
            <option value="retail">Regular Retail Customer</option>  
            <option value="wholesale">Wholesale Vendor</option>  
        </select>  
        <br><br>  
    </div>  

    <div id="vendorDropdownArea" style="display: none;">  
        <label>Select Saved Vendor:</label>  
        <select id="vendorSelector">  
            <option value="">-- Select Vendor --</option>  
        </select>  
        <br><br>  

        <div class="no-print">  
            <label>Contract Discount:</label>  
            <input type="text" id="vendorDiscountBox" readonly value="0%">  
            &nbsp;&nbsp;&nbsp;  
            <label>Outstanding Balance:</label>  
            <input type="text" id="vendorBalanceBox" readonly value="Rs. 0.00">  
            <br><br>  
        </div>  
    </div>  

    <label>Customer Name:</label>  
    <input type="text" id="custName" placeholder="Enter Name"><br><br>  

    <label>Customer Ph No:</label>  
    <input type="number" id="custPhone" placeholder="Enter Phone Number"><br><br>  

    <table border="1" id="invoiceItemsTable" width="100%">  
        <thead>  
            <tr>  
                <th>SKU</th>  
                <th>Product Name</th>  
                <th>Quantity</th>  
                <th>Rate</th>  
                <th>Amount</th>  
                <th class="no-print">Action</th>  
            </tr>  
        </thead>  
        <tbody id="invoiceTableBody">  
        </tbody>  
    </table>  

    <br>  
    <button type="button" id="addItemRowBtn" class="no-print">+ Add Item Line</button>  
    <br><br>  

    <label>Price (Subtotal):</label>  
    <input type="number" id="priceBox" readonly value="0.00"><br><br>  

    <label>Tax Bracket:</label>  
    <select id="gst">  
        <option value="0">GST 0%</option>  
        <option value="5">GST 5%</option>  
        <option value="12">GST 12%</option>  
        <option value="18">GST 18%</option>  
        <option value="28">GST 28%</option>  
    </select>  
    <br><br>  

    <label><strong>Total Amount:</strong></label>  
    <input type="number" id="totalAmount" readonly value="0.00">  
    <br><br><br>  

    <div id="statusNotificationArea"></div>

    <center>  
        <b>THANK YOU</b>  
        <br><br>  
        <button type="button" id="submitInvoiceBtn" class="btn-action-primary no-print">Submit Bill</button>  
        <button type="button" id="printInvoiceBtn" class="btn-action-secondary no-print" disabled>Print Bill</button>  
    </center>  
</form>  

<script type="module">  
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";  
    import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";  

    const firebaseConfig = {  
        apiKey: "AIzaSyC7bl9e1sDibEe4BP1PzWnOhwt_gpL7abo",  
        authDomain: "zbillz-f4798.firebaseapp.com",  
        databaseURL: "https://zbillz-f4798-default-rtdb.firebaseio.com",  
        projectId: "zbillz-f4798",  
        storageBucket: "zbillz-f4798.firebasestorage.app",  
        messagingSenderId: "495466751324",  
        appId: "1:495466751324:web:324e3440f13fad0acdcd99"  
    };  

    const app = initializeApp(firebaseConfig);  
    const db = getDatabase(app);  

    let globalVendorsObject = {};  
    let currentVendorDiscount = 0;  
    let rowCounterIndex = 0;  

    // --- STABLE PERSISTENT ID SEQUENCER ENGINE ---  
    function initializeInvoiceIdentifiers() {  
        let today = new Date();  
        let datePart = today.getFullYear() + String(today.getMonth() + 1).padStart(2, "0") + String(today.getDate()).padStart(2, "0");  

        let sessionBillNo = sessionStorage.getItem("currentBillNo");  
        let sessionInvId = sessionStorage.getItem("currentInvId");  

        if (!sessionBillNo) {  
            let persistentCount = localStorage.getItem("billNumberCounter") || 1001;  
            sessionBillNo = "BILL-" + datePart + "-" + persistentCount;  
            sessionInvId = "INV-" + Math.floor(100000 + Math.random() * 900000);  

            localStorage.setItem("billNumberCounter", Number(persistentCount) + 1);  
            sessionStorage.setItem("currentBillNo", sessionBillNo);  
            sessionStorage.setItem("currentInvId", sessionInvId);  
        }  

        document.getElementById("billNo").value = sessionBillNo;  
        document.getElementById("invoiceId").value = sessionInvId;  
        document.getElementById("billDate").value = today.toISOString().split("T")[0];  
        document.getElementById("billTime").value = String(today.getHours()).padStart(2, "0") + ":" + String(today.getMinutes()).padStart(2, "0");  
    }  

    // --- RELIABLE EVENT DRIVEN GRID GENERATOR ---  
    window.addNewRowItem = function() {  
        rowCounterIndex++;  
        const tbody = document.getElementById("invoiceTableBody");  
        const newRow = document.createElement("tr");  
        newRow.id = `billRow_${rowCounterIndex}`;  

        newRow.innerHTML = `  
            <td><input type="text" id="pcode_${rowCounterIndex}" data-id="${rowCounterIndex}" style="width:90%;"></td>  
            <td><input type="text" id="pname_${rowCounterIndex}" readonly style="width:95%;"></td>  
            <td><input type="number" id="qty_${rowCounterIndex}" data-id="${rowCounterIndex}" min="1" value="1" style="width:80px;"></td>  
            <td><input type="number" id="rate_${rowCounterIndex}" readonly style="width:100px;"></td>  
            <td><input type="number" id="amount_${rowCounterIndex}" readonly value="0.00" style="width:120px;"></td>  
            <td class="no-print"><button type="button" style="background:#ef4444; color:white; border:none; padding:5px 10px; border-radius:4px; font-weight:bold; cursor:pointer;" onclick="removeBillRowLine('${newRow.id}')">X</button></td>  
        `;  
        tbody.appendChild(newRow);  

        const codeInput = document.getElementById(`pcode_${rowCounterIndex}`);  
        const qtyInput = document.getElementById(`qty_${rowCounterIndex}`);  

        codeInput.onkeyup = function(e) {  
            fetchSkuProductRowData(e.target.dataset.id);  
        };  
        qtyInput.oninput = function() {  
            evaluateMasterTotalsCalculations();  
        };  
    };  

    window.removeBillRowLine = function(rowId) {  
        const row = document.getElementById(rowId);  
        if(row) {  
            row.remove();  
            evaluateMasterTotalsCalculations();  
        }  
    };  

    // --- REALTIME BACKEND SKU MATCHING LOOPS ---  
    async function fetchSkuProductRowData(index) {  
        const sku = document.getElementById(`pcode_${index}`).value.trim();  
        if (!sku) return;  

        try {  
            const snapshot = await get(ref(db, "inventory"));  
            if (snapshot.exists()) {  
                const products = snapshot.val();  
                for (let key in products) {  
                    if (String(products[key].sku) === String(sku)) {  
                        document.getElementById(`pname_${index}`).value = products[key].productName || "";  
                        document.getElementById(`rate_${index}`).value = products[key].price || 0;  
                        evaluateMasterTotalsCalculations();  
                        return;  
                    }  
                }  
            }  
        } catch (err) {  
            console.error("Database lookup error: ", err);  
        }  
    }  

    // --- INDEPENDENT MATHEMATICAL ENGINE ---  
    window.evaluateMasterTotalsCalculations = function() {  
        let totalGrossSubtotal = 0;  
        const gstPercent = Number(document.getElementById("gst").value) || 0;  

        const rows = document.querySelectorAll("#invoiceTableBody tr");  
        rows.forEach(row => {  
            const index = row.id.split("_")[1];  
            const qtyElement = document.getElementById(`qty_${index}`);  
            const rateElement = document.getElementById(`rate_${index}`);  
            const amountElement = document.getElementById(`amount_${index}`);  

            if (qtyElement && rateElement && amountElement) {  
                const qty = Number(qtyElement.value) || 0;  
                const rate = Number(rateElement.value) || 0;  
                let lineGross = qty * rate;  
                totalGrossSubtotal += lineGross;  
                amountElement.value = lineGross.toFixed(2);  
            }  
        });  

        let discountDeduction = (totalGrossSubtotal * currentVendorDiscount) / 100;  
        let netSubtotal = totalGrossSubtotal - discountDeduction;  
        let gstAmount = (netSubtotal * gstPercent) / 100;  
        let finalInvoiceTotal = netSubtotal + gstAmount;  

        document.getElementById("priceBox").value = totalGrossSubtotal.toFixed(2);  
        document.getElementById("totalAmount").value = finalInvoiceTotal.toFixed(2);  
    };  

    // --- WHOLESALE DATA SYNC PANELS ---  
    const customerTypeSelector = document.getElementById("customerTypeSelector");  
    const vendorDropdownArea = document.getElementById("vendorDropdownArea");  
    const vendorSelector = document.getElementById("vendorSelector");  

    customerTypeSelector.addEventListener("change", async () => {  
        if (customerTypeSelector.value === "wholesale") {  
            vendorDropdownArea.style.display = "block";  
            await fetchWholesaleVendors();  
        } else {  
            vendorDropdownArea.style.display = "none";  
            currentVendorDiscount = 0;  
            document.getElementById("custName").value = "";  
            document.getElementById("custPhone").value = "";  
            evaluateMasterTotalsCalculations();  
        }  
    });  

    async function fetchWholesaleVendors() {  
        try {  
            const snapshot = await get(ref(db, "wholesale_vendors"));  
            vendorSelector.innerHTML = '<option value="">-- Select Vendor Profile --</option>';  

            if (snapshot.exists()) {  
                globalVendorsObject = snapshot.val();  
                for (let key in globalVendorsObject) {  
                    const vendor = globalVendorsObject[key];  
                    const companyName = vendor.companyName || vendor.vendorName || vendor.name || key;  
                    vendorSelector.innerHTML += `<option value="${key}">${companyName}</option>`;  
                }  
            }  
        } catch (err) {  
            console.error("Error reading vendor values: ", err);  
        }  
    }  

    vendorSelector.addEventListener("change", () => {  
        const selectedKey = vendorSelector.value;  
        if (selectedKey && globalVendorsObject[selectedKey]) {  
            const vendorData = globalVendorsObject[selectedKey];  

            document.getElementById("custName").value = vendorData.companyName || vendorData.vendorName || vendorData.name || selectedKey;  
            document.getElementById("custPhone").value = vendorData.phone || vendorData.contact || "";  

            currentVendorDiscount = Number(vendorData.discount) || Number(vendorData.discountRate) || 0;  
            const outstandingBalance = vendorData.balance || vendorData.outstanding || 0;  

            document.getElementById("vendorDiscountBox").value = currentVendorDiscount + "%";  
            document.getElementById("vendorBalanceBox").value = "Rs. " + Number(outstandingBalance).toFixed(2);  
        } else {  
            currentVendorDiscount = 0;  
            document.getElementById("vendorDiscountBox").value = "0%";  
            document.getElementById("vendorBalanceBox").value = "Rs. 0.00";  
        }  
        evaluateMasterTotalsCalculations();  
    });  

    // --- CORE TRANSACTION ARRAY PACKAGER & SUBMITTER ---
    function captureInvoiceItemsAsPayload() {
        const itemPayloadArray = [];
        const rows = document.querySelectorAll("#invoiceTableBody tr");
        
        rows.forEach(row => {
            const index = row.id.split("_")[1];
            const skuCode = document.getElementById(`pcode_${index}`).value.trim();
            const prodName = document.getElementById(`pname_${index}`).value.trim();
            const quantity = Number(document.getElementById(`qty_${index}`).value) || 0;
            const rateCost = Number(document.getElementById(`rate_${index}`).value) || 0;
            const rowTotal = Number(document.getElementById(`amount_${index}`).value) || 0;

            if (skuCode !== "" || prodName !== "") {
                itemPayloadArray.push({
                    sku: skuCode,
                    productName: prodName || "General Store Item",
                    quantity: quantity,
                    rate: rateCost,
                    amount: rowTotal
                });
            }
        });
        return itemPayloadArray;
    }

    async function executeInvoiceSubmissionPipeline() {
        const submitBtn = document.getElementById("submitInvoiceBtn");
        const printBtn = document.getElementById("printInvoiceBtn");
        const statusArea = document.getElementById("statusNotificationArea");

        statusArea.style.display = "block";
        statusArea.style.background = "rgba(234, 179, 8, 0.2)";
        statusArea.style.color = "#fbbf24";
        statusArea.innerText = "⏳ Pushing invoice payload to real-time database...";
        
        submitBtn.disabled = true;

        const targetInvoiceId = document.getElementById("invoiceId").value.trim();

        const finalBillPayload = {
            invoiceId: targetInvoiceId,
            billNo: document.getElementById("billNo").value.trim(),
            date: document.getElementById("billDate").value,
            time: document.getElementById("billTime").value,
            billingStaff: document.getElementById("billingStaff").value.trim() || "System Admin",
            paymentMethod: document.getElementById("paymentMethod").value,
            customerType: document.getElementById("customerTypeSelector").value,
            customerName: document.getElementById("custName").value.trim() || "Walk-In Customer",
            customerPhone: document.getElementById("custPhone").value.trim() || "N/A",
            subtotal: Number(document.getElementById("priceBox").value) || 0,
            taxBracket: document.getElementById("gst").value + "%",
            totalAmount: Number(document.getElementById("totalAmount").value) || 0,
            items: captureInvoiceItemsAsPayload()
        };

        try {
            await set(ref(db, "sales/" + targetInvoiceId), finalBillPayload);
            
            statusArea.style.background = "rgba(34, 197, 94, 0.2)";
            statusArea.style.color = "#4ade80";
            statusArea.innerText = `🎉 Invoice saved to Firebase! Key: ${targetInvoiceId}`;
            
            printBtn.disabled = false; // Safely unlocks print button only after success
            submitBtn.disabled = false;

        } catch (error) {
            console.error("Data push failed: ", error);
            statusArea.style.background = "rgba(239, 68, 68, 0.2)";
            statusArea.style.color = "#f87171";
            statusArea.innerText = "❌ Database transmission failed. Please verify connectivity profiles.";
            submitBtn.disabled = false;
        }
    }

    document.getElementById("gst").addEventListener("change", evaluateMasterTotalsCalculations);  
    document.getElementById("addItemRowBtn").addEventListener("click", window.addNewRowItem);  
    document.getElementById("submitInvoiceBtn").addEventListener("click", executeInvoiceSubmissionPipeline);

    document.getElementById("printInvoiceBtn").addEventListener("click", () => {  
        sessionStorage.removeItem("currentBillNo");  
        sessionStorage.removeItem("currentInvId");  
        window.print();  
    });  

    initializeInvoiceIdentifiers();  
    window.addNewRowItem();  
</script>

</body>  
</html>
