<!DOCTYPE html>
<html>
<head>
<title>Invoice Tracking Dashboard</title>

<style>
body{
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    padding: 30px;
}

.box{
    width: 700px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 0 10px #999;
}

input{
    width: 95%;
    padding: 10px;
    margin: 10px 0;
}

button{
    padding: 10px 20px;
    background: blue;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

table{
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
}

th, td{
    border: 1px solid #ddd;
    padding: 10px;
    text-align: left;
}

#dashboard{
    display: none;
}

.item-table th{
    background: #f5f5f5;
}
</style>
</head>

<body>

<div class="box">

<h2>Invoice Tracking</h2>

<input type="text" id="invoice" placeholder="Enter Invoice ID">

<button onclick="trackInvoice()">Track</button>

<p id="result"></p>

<div id="dashboard">

<h3>Invoice Dashboard</h3>

<table>

<tr>
    <th>Invoice ID</th>
    <td id="invoiceId"></td>
</tr>

<tr>
    <th>Customer Name</th>
    <td>Vyshnav Saran</td>
</tr>

<tr>
    <th>Payment Method</th>
    <td>UPI</td>
</tr>

<tr>
    <th>Invoice Status</th>
    <td>Paid</td>
</tr>

<tr>
    <th>Delivery Status</th>
    <td>Delivered</td>
</tr>

</table>

<h3>Order Details</h3>

<table class="item-table">

<tr>
    <th>Item</th>
    <th>Quantity</th>
    <th>Rate</th>
    <th>Total</th>
</tr>

<tr>
    <td>Rice</td>
    <td>2 kg</td>
    <td>₹60/kg</td>
    <td>₹120</td>
</tr>

<tr>
    <td>Milk</td>
    <td>2</td>
    <td>₹30</td>
    <td>₹60</td>
</tr>

<tr>
    <td>Bread</td>
    <td>2</td>
    <td>₹40</td>
    <td>₹80</td>
</tr>

<tr>
    <th colspan="3">Grand Total</th>
    <th>₹260</th>
</tr>

</table>

</div>

</div>

<script>
function trackInvoice() {

    let invoice =
    document.getElementById("invoice").value;

    if(invoice === ""){
        document.getElementById("result").innerHTML =
        "Please enter an Invoice ID";
        return;
    }

    document.getElementById("invoiceId").innerHTML =
    invoice;

    document.getElementById("result").innerHTML =
    "Invoice Found Successfully";

    document.getElementById("dashboard").style.display =
    "block";
}
</script>

</body>
</html>
