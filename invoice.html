<!DOCTYPE html>
<html>
<head>
<title>Invoice Tracking</title>
<style>
body 
{
font-family: Arial;
background: #f2f2f2;
padding: 30px;
}
.box 
{
background: white;
padding: 20px;
width: 300px;
margin: auto;
border-radius: 10px;
text-align: center;
box-shadow: 0 0 10px gray;
}
input 
{
width: 90%;
padding: 10px;
margin: 10px 0;
}
button 
{
padding: 10px 20px;
background: blue;
color: white;
border: none;
cursor: pointer;
}
#result 
{
margin-top: 15px;
color: green;
font-weight: bold;
}
</style>
</head>
<body>
<div class="box">
<h2>Invoice Tracking</h2>
<input type="text" id="invoice" placeholder="Enter Invoice ID">
<button onclick="trackInvoice()">Track</button>
<p id="result"></p>
</div>
<script>
function trackInvoice() {
let id = document.getElementById("invoice").value;
if(id == "") 
{
document.getElementById("result").innerHTM
=
"Please enter Invoice ID";
}
else 
{
document.getElementById("result").innerHTM
=
"Invoice " + id + " is Paid";
}
}
</script>
</body>
</html>
