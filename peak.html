<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zbilz - Inventory View</title>
    
    <script src="auth-guard.js"></script>

    <link rel="stylesheet" href="peak.css">
</head>
<body>

    <h1>Peak <span>Inventory</span></h1>

    <div class="box">
        <input type="text" id="searchSku" placeholder="Enter SKU (e.g., SKU-X7K21)">
        <button class="searchBtn" onclick="searchProduct()">Search Database</button>

        <div class="result">Result queries will appear here...</div>
    </div>

    <div class="box">
        <h3>All Stock Items</h3>
        <div id="tableArea">Connecting to real-time engine...</div>
        
        <a href="index.html" class="back-btn">Back to Home</a>
    </div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyC7bl9e1sDibEe4BP1PzWnOhwt_gpL7abo",
    authDomain: "zbillz-f4798.firebaseapp.com",
    databaseURL: "https://zbillz-f4798-default-rtdb.firebaseio.com",
    projectId: "zbillz-f4798",
    storageBucket: "zbillz-f4798.firebasestorage.app",
    messagingSenderId: "495466751324",
    appId: "1:495466751324:web:324e3440f13fad0acdcd99"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let products = [];

// FETCH REALTIME UPDATES FROM FIREBASE
onValue(ref(db, "inventory"), (snapshot) => {
    products = [];

    if (snapshot.exists()) {
        snapshot.forEach(item => {
            products.push(item.val());
        });
    }

    renderTable();
});

// BUILD STYLISH METRIC DATA TABLE
function renderTable() {
    let box = document.getElementById("tableArea");

    if (products.length === 0) {
        box.innerHTML = "<p style='color: #aaa;'>No active products found in warehouse.</p>";
        return;
    }

    let html = `
        <table>
            <tr>
                <th>Product Name</th>
                <th>Quantity (g / b)</th>
                <th>SKU Code</th>
            </tr>
    `;

    products.forEach(p => {
        html += `
            <tr>
                <td>${p.productName}</td>
                <td>${p.quantityGrams}</td>
                <td style="color: #ff7200; font-weight: bold;">${p.sku}</td>
            </tr>
        `;
    });

    html += `</table>`;
    box.innerHTML = html;
}

// EXECUTE UNIQUE SKU DISCOVERY SEARCH
window.searchProduct = function () {
    let typedSku = document.getElementById("searchSku").value.trim().toUpperCase();
    let box = document.querySelector(".result");

    if (!typedSku) {
        box.innerHTML = "⚠️ Please type an item SKU key first.";
        return;
    }

    // Dynamic case-insensitive or exact lookup query matching
    let found = products.find(p => p.sku && p.sku.toUpperCase() === typedSku);

    if (!found) {
        box.innerHTML = "❌ Match not found. Verify SKU identifier sequence.";
        return;
    }

    box.innerHTML = `
        <span style="color: #ff7200; font-weight: bold; font-size: 16px;">📦 Product Discovered</span><br><br>
        <b>Name:</b> ${found.productName}<br>
        <b>Description:</b> ${found.description || 'N/A'}<br>
        <b>Stock Quantity:</b> ${found.quantityGrams} grams/boxes<br>
        <b>Total Products Count:</b> ${found.productCount}<br>
        <b>Unit Costing:</b> ₹${found.price}<br>
        <b>System SKU:</b> <span style="color: #ff7200;">${found.sku}</span>
    `;
};

</script>

</body>
</html>
