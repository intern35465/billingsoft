<!DOCTYPE html>
<html>

<head>
    <title>Peak</title>

    <style>
        body {
            font-family: Arial;
            padding: 20px;
            background: #f4f4f4;
        }

        .box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
        }

        button {
            width: 100%;
            margin-top: 10px;
            padding: 10px;
            cursor: pointer;
        }

        .searchBtn {
            background: blue;
            color: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: center;
        }

        th {
            background: #ddd;
        }
    </style>
</head>

<body>

<h1>Peak</h1>

<div class="box">

    <input type="text" id="searchSku" placeholder="Enter SKU">
    <button class="searchBtn" onclick="searchProduct()">Search</button>

    <div class="result">Result will appear here</div>

</div>

<div class="box">

    <h3>All Products</h3>

    <div id="tableArea">Loading...</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyC7bl9e1sDibEe4BP1PzWnOhwt_gpL7abo",
    authDomain: "zbillz-f4798.firebaseapp.com",
    databaseURL: "https://zbillz-f4798-default-rtdb.firebaseio.com",
    projectId: "zbillz-f4798",
    storageBucket: "zbillz-f4798.firebasestorage.app",
    messagingSenderId: "495466751324",
    appId: "1:495466751324:web:324e3440f13fad0acdcd99"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let products = [];

// LOAD DATA FROM FIREBASE
onValue(ref(db, "inventory"), (snapshot) => {

    products = [];

    snapshot.forEach(item => {
        products.push(item.val());
    });

    renderTable();
});

function renderTable() {

    let box = document.getElementById("tableArea");

    if (products.length === 0) {
        box.innerHTML = "No products available";
        return;
    }

    let html = `
        <table>
            <tr>
                <th>Name</th>
                <th>Quantity (g)</th>
                <th>SKU</th>
            </tr>
    `;

    products.forEach(p => {
        html += `
            <tr>
                <td>${p.productName}</td>
                <td>${p.quantityGrams}</td>
                <td>${p.sku}</td>
            </tr>
        `;
    });

    html += `</table>`;

    box.innerHTML = html;
}

// SEARCH
window.searchProduct = function () {

    let sku = document.getElementById("searchSku").value;

    let found = products.find(p => p.sku === sku);

    let box = document.querySelector(".result");

    if (!found) {
        box.innerHTML = "❌ Product not found";
        return;
    }

    box.innerHTML = `
        <b>Product Found</b><br><br>
        Name: ${found.productName}<br>
        Description: ${found.description}<br>
        Quantity: ${found.quantityGrams}<br>
        No: ${found.productCount}<br>
        Price: ${found.price}<br>
        SKU: ${found.sku}
    `;
};

</script>

</body>
</html>
